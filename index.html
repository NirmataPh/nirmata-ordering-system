<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nirmata Ordering System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Nirmata Order Form</h1>
    <p class="subtitle">Punan ang form para mag-order.</p>

    <form id="order-form">
      <label for="customer_name">Buong Pangalan</label>
      <input type="text" id="customer_name" required />

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" required />

      <label for="email">Email</label>
      <input type="email" id="email" required />

      <label for="product">Produkto</label>
      <input type="text" id="product" placeholder="Hal. Keychain, Trophy, Figure" required />

      <label for="customization">Customization / Detalye</label>
      <textarea id="customization" rows="3" placeholder="Kulay, sukat, disenyo, atbp."></textarea>

      <div class="row">
        <div>
          <label for="quantity">Quantity</label>
          <input type="number" id="quantity" min="1" value="1" required />
        </div>
        <div>
          <label for="total_amount">Total Amount (₱)</label>
          <input type="number" id="total_amount" min="0" step="0.01" required />
        </div>
      </div>

      <label for="notes">Karagdagang Notes</label>
      <textarea id="notes" rows="2" placeholder="Optional"></textarea>

      <label for="file">Mag-upload ng Reference/Design (optional)</label>
      <input type="file" id="file" accept="image/*,.pdf" />

      <button type="submit" id="submit-btn">I-submit ang Order</button>

      <p id="status-msg"></p>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
